key: energia_solar
name: Energia Solar Fotovoltaica
version: 1.0.0

# =====================================================================
# O 9º segmento. Nasceu de uma pergunta do fundador — "o sistema atende
# vendedor de painel solar?" — e da resposta honesta: `sob_medida` dizia
# "solar" no nome e NENHUMA das suas entradas falava de solar.
#
# POR QUE MERECE SKILL PRÓPRIA, e não um remendo em `sob_medida`:
# o DNA é outro. Solar exige conta de luz, payback, financiamento e
# homologação na concessionária — campos que não existem para quem faz
# armário, e que poluiriam aquele manifesto.
#
# O QUE ESTE MERCADO TEM DE ÚNICO (pesquisa ago/2026):
#   • A CONTA DE LUZ É O DADO DE ENTRADA. Sem ela não há dimensionamento,
#     não há geração estimada e não há payback. Cotar sem a conta é chute.
#   • O CLIENTE NUNCA ZERA A CONTA. O custo de disponibilidade continua:
#     30 kWh monofásico, 50 kWh bifásico, 100 kWh trifásico. "Conta zero"
#     é a promessa mais comum e mais perigosa do setor.
#   • ENTRE INSTALAR E ECONOMIZAR EXISTEM 40 A 100 DIAS. Projeto, vistoria,
#     troca do medidor e homologação (REN 1.059/2023: a distribuidora tem
#     30 dias para o projeto e 7 dias úteis para a vistoria). O prazo é da
#     concessionária, não do instalador — e o cliente não sabe disso.
#   • O RELÓGIO REGULATÓRIO CORRE CONTRA A ESPERA. O Fio B é progressivo:
#     45% em 2025, 60% em 2026, 75% em 2027, 90% em 2028. Quem tem sistema
#     homologado até 06/01/2023 tem direito adquirido até 2045 — para todo
#     o resto, adiar custa mais caro a cada ano. É urgência REAL, não
#     inventada: por isso pode ser usada.
#   • O INVERSOR NÃO DURA O QUE O PAINEL DURA. Módulo tem garantia de
#     desempenho de ~25 anos (80% da capacidade); inversor, 5 a 10 anos.
#     Quem esconde isso perde a indicação lá na frente.
#
# Nenhuma linha do núcleo muda por causa deste arquivo. É a Lei 1.
# =====================================================================

capabilities:
  - prospeccao
  - licitacoes

vocabulary:
  lead: "interessado"
  conversion: "projeto fechado"
  churn: "orçamento perdido"
  catalog_item: "sistema"

discovery_axis: "consumo e conta de luz (quanto paga por mês, qual o padrão de ligação, o que quer resolver e para quando)"

# ---------------------------------------------------------------------
# JORNADA — ticket alto, decisão cara e irreversível, ciclo longo.
#
# `em_execucao` existe porque é ali que a reputação se ganha ou se perde:
# o cliente assinou, pagou e vai esperar semanas pela homologação sem
# entender por quê. Etapa não-terminal de propósito — é trabalho em
# aberto, com cadência própria.
# ---------------------------------------------------------------------
journey:
  allow_skip: true
  allow_regression: true
  stages:
    - key: contato
      label: "Primeiro contato"
      goal: "Entender o que motivou a busca. Nunca dar preço por kWp sem ver a conta."
    - key: qualificacao
      label: "Qualificação"
      cadence: pedir_conta
      goal: "Conseguir a conta de luz e entender padrão de ligação, telhado e prazo. Sem a conta não há proposta."
      phases:
        - { key: pedido,   label: "Pedir a conta de luz", offset_days: 0 }
        - { key: cobranca, label: "Cobrar a conta",       offset_days: 2 }
    - key: visita_tecnica
      label: "Visita técnica"
      cadence: pre_visita
      goal: "Conferir telhado, padrão de entrada e sombreamento. É na visita que o orçamento vira projeto."
      phases:
        - { key: agendada,  label: "Visita agendada",   offset_days: 0 }
        - { key: confirmar, label: "Confirmar véspera",  offset_days: -1 }
        - { key: realizada, label: "Visita realizada",   offset_days: 1 }
    - key: proposta
      label: "Proposta e simulação"
      cadence: pos_proposta
      goal: "Apresentar dimensionamento, geração estimada, economia e payback. Apresentar, não só enviar."
      phases:
        - { key: envio,    label: "Proposta entregue", offset_days: 0 }
        - { key: retorno,  label: "Confirmar leitura", offset_days: 2 }
        - { key: cobranca, label: "Cobrar posição",    offset_days: 7 }
    - key: negociacao
      label: "Negociação e pagamento"
      goal: "Isolar o que trava (valor, financiamento, telhado, cônjuge) e viabilizar o pagamento."
    - key: em_execucao
      label: "Em execução"
      cadence: pos_venda
      goal: "Projeto, instalação e homologação. Manter o cliente informado durante a espera da concessionária."
    - key: fechado
      label: "Gerando"
      terminal: true
      won: true
      goal: "Homologado e gerando. Daqui em diante o jogo é manutenção, ampliação e indicação."
    - key: perdido
      label: "Perdido"
      terminal: true

# ---------------------------------------------------------------------
# REFERÊNCIAS DO SETOR (pesquisa ago/2026)
# NÃO são fatos da empresa — o motor nunca afirma isto ao cliente; só o
# DNA vale. Servem de parâmetro para quem vende entender o terreno.
# ---------------------------------------------------------------------
benchmarks:
  custo_de_disponibilidade: >-
    Mesmo gerando tudo o que consome, o cliente continua pagando a taxa mínima
    da distribuidora: 30 kWh (monofásico), 50 kWh (bifásico) ou 100 kWh
    (trifásico). Prometer "conta zero" é criar uma reclamação para daqui a
    dois meses.
  fio_b_progressivo: >-
    Cobrança sobre a energia injetada, subindo por ano: 45% em 2025, 60% em
    2026, 75% em 2027, 90% em 2028. Quem homologou até 06/01/2023 tem direito
    adquirido até 2045. Para os demais, adiar a decisão custa mais caro a cada
    ano — urgência real, que não precisa ser inventada.
  prazo_de_homologacao: >-
    Entre a instalação e a economia existe a concessionária: a REN 1.059/2023
    dá 30 dias para aprovar o projeto e 7 dias úteis para a vistoria. Na
    prática o processo inteiro leva de 40 a 100 dias, conforme a distribuidora.
    O prazo não é do instalador, mas a ansiedade é do cliente.
  creditos_60_meses: >-
    O excedente vira crédito válido por 60 meses. Sistema superdimensionado
    gera crédito que expira sem uso — vender maior do que precisa é prejuízo
    disfarçado de venda maior.
  garantias_desiguais: >-
    Módulo: garantia de desempenho de cerca de 25 anos (aproximadamente 80% da
    capacidade ao fim) e de produto entre 10 e 12 anos. Inversor: 5 a 10 anos,
    com extensão paga. Quem apresenta "25 anos de garantia" sem separar as duas
    coisas está criando o próprio problema.
  o_que_entra_no_orcamento: >-
    Módulos, inversor, estrutura conforme o telhado, string box e proteções
    (DPS CC e CA, disjuntores, aterramento), cabeamento, projeto elétrico com
    ART, mão de obra e homologação. Orçamento que não diz o que inclui é o que
    perde para o "mais barato" que não inclui nada.

# ---------------------------------------------------------------------
# CAMPOS PRÓPRIOS DO SEGMENTO
# ---------------------------------------------------------------------
contact_fields:
  - key: tipo_imovel
    label: "Tipo de imóvel"
    type: enum
    options: [residencia, comercio, industria, rural, condominio, orgao_publico, outro]
  # Define o custo de disponibilidade que o cliente vai continuar pagando.
  - key: padrao_ligacao
    label: "Padrão de ligação"
    type: enum
    options: [monofasico, bifasico, trifasico, nao_sei]
  - key: faixa_conta
    label: "Conta de luz por mês"
    type: enum
    options: [ate_200, de_200_a_500, de_500_a_1000, de_1000_a_3000, acima_3000, nao_informado]
  # Muda a estrutura de fixação, o prazo e o custo da instalação.
  - key: tipo_telhado
    label: "Telhado"
    type: enum
    options: [ceramico, metalico, fibrocimento, laje, solo, sem_area_disponivel, nao_sei]
  - key: forma_pagamento
    label: "Como pretende pagar"
    type: enum
    options: [a_vista, financiamento, consorcio, cartao, nao_sei]
  - key: gatilho
    label: "O que motivou"
    type: enum
    options: [conta_alta, obra_nova, ampliacao, sustentabilidade, valorizacao_imovel, indicacao, outro]
  # Alimenta o motor de recompra: limpeza e revisão têm data.
  - key: ciclo_manutencao
    label: "Ciclo de manutenção"
    type: enum
    options: [semestral, anual, sem_contrato, indefinido]

# ---------------------------------------------------------------------
# O sistema instalado não é o fim: limpeza e revisão têm data, e cliente
# com sistema sujo gera menos e reclama do fornecedor, não da poeira.
# ---------------------------------------------------------------------
recurrence:
  frequency_field: ciclo_manutencao
  remind_before_days: 15
  intervals_days:
    semestral: 180
    anual: 365
  default_days: 365

# ---------------------------------------------------------------------
# A visita técnica tem hora marcada e consome meio período de um técnico.
# ---------------------------------------------------------------------
scheduling:
  enabled: true
  default_duration_min: 90
  slot_step_min: 60
  min_advance_min: 240

# ---------------------------------------------------------------------
# REGISTRO DE ATENDIMENTO COM VALOR
# Aqui o dinheiro é acompanhado por proposta e projeto, não por atendimento.
# ---------------------------------------------------------------------
services:
  enabled: false

lead_sources:
  - indicacao
  - site
  - whatsapp
  - instagram
  - prospeccao
  - licitacao
  - feira
  - parceiro_construtor
  - cliente_antigo
  - outro

# ---------------------------------------------------------------------
# SEÇÕES DE DNA — os fatos que o motor pode afirmar sobre a empresa.
# As CHAVES são contrato com `required_facts`. Traduza label e help,
# nunca a chave.
# ---------------------------------------------------------------------
dna_sections:
  - key: oferta
    label: "O que você instala"
    required: true
    fields:
      - { key: tipos_sistema, type: list, required: true, label: "Tipos de sistema", help: "Ex.: conectado à rede (on-grid), híbrido com bateria, bombeamento rural" }
      - { key: marcas_modulo, type: list, label: "Marcas de módulo", help: "As marcas de painel que você trabalha" }
      - { key: marcas_inversor, type: list, label: "Marcas de inversor", help: "As marcas de inversor que você trabalha" }
      - { key: telhados_atendidos, type: list, required: true, label: "Telhados que atende", help: "Ex.: cerâmico, metálico, fibrocimento, laje, solo" }
  - key: precos
    label: "Preço e pagamento"
    required: true
    fields:
      - { key: como_cobra, type: text, required: true, label: "Como você cobra", help: "Ex.: projeto fechado por kWp instalado, definido após a análise da conta" }
      - { key: faixa, type: money_range, label: "Faixa de investimento", help: "A faixa dos projetos que você costuma fazer. Ex.: de R$ 15 mil a R$ 90 mil" }
      - { key: formas_pagamento, type: list, required: true, label: "Formas de pagamento", help: "Ex.: Pix, cartão em 12x, financiamento bancário" }
      - { key: financiamento, type: text, label: "Financiamento", help: "Com quais bancos ou linhas você trabalha e como funciona a aprovação" }
      - { key: o_que_inclui, type: text, required: true, label: "O que está incluso", help: "Ex.: kit, estrutura, proteções, projeto com ART, mão de obra e homologação" }
  - key: execucao
    label: "Prazos e execução"
    required: true
    fields:
      - { key: prazo_visita, type: text, required: true, label: "Prazo da visita técnica", help: "Em quanto tempo você vai até o local" }
      - { key: prazo_proposta, type: text, required: true, label: "Prazo da proposta", help: "Quanto tempo até entregar a proposta com simulação" }
      - { key: prazo_instalacao, type: text, required: true, label: "Prazo da instalação", help: "Da aprovação até o sistema montado. Ex.: 2 a 5 dias no telhado" }
      - { key: prazo_homologacao, type: text, required: true, label: "Prazo de homologação", help: "Quanto costuma levar na SUA concessionária — é o prazo dela, não o seu" }
      - { key: distribuidoras, type: list, label: "Concessionárias que você homologa", help: "Ex.: RGE, CEEE Equatorial, CPFL" }
  - key: garantias
    label: "Garantias"
    required: true
    fields:
      - { key: modulo, type: text, required: true, label: "Garantia do módulo", help: "Separe desempenho e produto. Ex.: 25 anos de desempenho, 12 de produto" }
      - { key: inversor, type: text, required: true, label: "Garantia do inversor", help: "Ex.: 10 anos, com extensão opcional" }
      - { key: instalacao, type: text, required: true, label: "Garantia da instalação", help: "A sua garantia de mão de obra e de estanqueidade do telhado" }
      - { key: seguro, type: text, label: "Seguro", help: "Se oferece seguro do sistema e o que ele cobre" }
  - key: pos_venda
    label: "Depois da instalação"
    fields:
      - { key: monitoramento, type: text, label: "Monitoramento", help: "Como o cliente acompanha a geração e quem avisa se cair" }
      - { key: manutencao, type: text, label: "Limpeza e revisão", help: "Com que frequência, o que inclui e quanto custa" }
      - { key: ampliacao, type: text, label: "Ampliação", help: "Como funciona aumentar o sistema depois" }
  - key: atuacao
    label: "Onde você atende"
    required: true
    fields:
      - { key: regiao, type: text, required: true, label: "Região atendida", help: "Cidades e raio de atendimento" }
      - { key: equipe_propria, type: boolean, label: "Equipe própria?", help: "Marque se a instalação é feita por equipe sua, sem terceirizar" }
      - { key: responsavel_tecnico, type: text, label: "Responsável técnico", help: "Quem assina a ART. Ex.: engenheiro eletricista com CREA ativo" }
  - key: diferencial
    label: "Diferencial"
    fields:
      - { key: motivo_escolher, type: text, required: true, label: "Por que fechar com você", help: "O que você resolve que o concorrente barato não resolve" }
      - { key: tempo_de_casa, type: text, label: "Tempo de mercado", help: "Desde quando instala e quantos sistemas já entregou" }
      - { key: obras_referencia, type: list, label: "Obras de referência", help: "Sistemas que o cliente pode ver ou sobre os quais pode perguntar" }
  - key: free_notes
    label: "Outras informações importantes"
    type: rich_text
    # Entra no contexto marcado como não estruturado.
    # Nunca pode ser fonte de preço, prazo ou garantia.

categories:
  pricing:            "Investimento, o que inclui, faixa e formas de pagamento"
  risk_free_entry:    "Análise da conta e simulação sem compromisso"
  availability:       "Prazos de visita, proposta, instalação e homologação"
  expertise_proof:    "Responsável técnico, tempo de mercado e obras entregues"
  catalog:            "Tipos de sistema, marcas, telhados atendidos e dimensionamento"
  goal_matching:      "Perfil do imóvel e do consumo → sistema certo"
  objections:         "Caro, vou esperar baratear, achei mais barato, e se eu mudar"
  commitment_offer:   "Fechamento, financiamento e o follow-up do orçamento"
  reciprocity:        "Simulação, análise da conta e visita técnica"
  limits_and_ethics:  "Conta zero, geração garantida e prazo da concessionária"
  retention:          "Homologação, monitoramento, limpeza, ampliação e indicação"
  ecosystem:          "Banco, concessionária, engenheiro e construtor parceiro"

# ---------------------------------------------------------------------
# ORQUESTRADOR DE ESTRATÉGIA — qual escola governa cada situação NESTE
# segmento. Ticket alto e decisão irreversível: fechamento por pressão
# derruba a conversão (Rackham). O inimigo aqui é o silêncio e o medo de
# errar, não a falta de argumento.
# ---------------------------------------------------------------------
strategy_map:
  pricing:             consultiva_spin
  risk_free_entry:     persuasao_cialdini
  availability:        consultiva_spin
  expertise_proof:     persuasao_cialdini
  catalog:             consultiva_spin
  goal_matching:       consultiva_spin
  objections:          negociacao_voss
  commitment_offer:    cadencia_blount
  reciprocity:         persuasao_cialdini
  limits_and_ethics:   relacionamento_carnegie
  retention:           cadencia_blount
  ecosystem:           relacionamento_carnegie

cadences:
  - key: pedir_conta
    applies_to: qualification
    steps:
      - { offset_days: 2, intent: "Cobrar a conta de luz — sem ela não existe proposta, só chute" }
      - { offset_days: 5, intent: "Oferecer buscar o consumo no aplicativo da concessionária junto com o cliente" }
    stop_on: [replied, converted, opted_out, lost]

  - key: pre_visita
    applies_to: appointment_confirm
    steps:
      - { offset_days: -1, intent: "Confirmar a visita e pedir acesso ao telhado e ao padrão de entrada" }
    stop_on: [converted, opted_out]

  - key: pos_proposta
    applies_to: proposal_followup
    steps:
      - { offset_days: 2, intent: "Confirmar que abriu a proposta e tirar dúvida da simulação" }
      - { offset_days: 7, intent: "Trazer ângulo novo: opção de financiamento ou escopo menor" }
      - { offset_days: 15, intent: "Perguntar o que decidiu — inclusive se foi não" }
    stop_on: [replied, converted, opted_out, lost]

  - key: pos_venda
    applies_to: onboarding
    steps:
      - { offset_days: 3, intent: "Avisar que o projeto entrou na concessionária e explicar o prazo dela" }
      - { offset_days: 20, intent: "Dar posição da homologação antes de o cliente perguntar" }
      - { offset_days: 45, intent: "Confirmar a troca do medidor e ensinar a ler a primeira conta" }
    stop_on: [opted_out]

  - key: reativacao
    applies_to: reactivation
    steps:
      - { offset_days: 0, intent: "Retomar com o que mudou: tarifa, Fio B do ano ou condição de pagamento" }
      - { offset_days: 30, intent: "Última tentativa, com porta aberta e sem cobrança" }
    stop_on: [replied, converted, opted_out]
    max_attempts: 3

hard_rules:
  - "NUNCA prometer conta zerada: o custo de disponibilidade continua sendo cobrado (30, 50 ou 100 kWh conforme o padrão de ligação)."
  - "Nunca afirmar geração, economia ou payback sem a conta de luz e sem o dimensionamento feito."
  - "O prazo de homologação é da concessionária. Informar como estimativa, nunca como compromisso da empresa."
  - "Separar sempre garantia de desempenho do módulo, garantia de produto e garantia do inversor — nunca dizer '25 anos de garantia' sem qualificar."
  - "Não afirmar marca, certificação, seguro ou financiamento que não esteja no DNA."

kpis:
  - taxa_conversao
  - ticket_medio
  - tempo_resposta_mediana
  - clientes_ativos
  - recompra
