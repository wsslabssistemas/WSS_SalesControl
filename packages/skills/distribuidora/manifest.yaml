key: distribuidora
name: Distribuidora e Atacado
version: 1.0.0

# =====================================================================
# B2B com carteira: vive de RECOMPRA e ao mesmo tempo precisa captar.
# A jornada não termina na venda — termina na recorrência.
# =====================================================================

capabilities:
  - prospeccao

vocabulary:
  lead: "cliente potencial"
  conversion: "primeiro pedido"
  churn: "cliente inativo"
  catalog_item: "linha de produto"

discovery_axis: "consumo (o que compra, quanto gira, de quem compra hoje)"

journey:
  allow_skip: true
  allow_regression: true
  stages:
    - key: prospeccao
      label: "Prospecção"
      cadence: pos_cotacao
      goal: "Achar o comprador e descobrir o que ele já compra."
      phases:
        - { key: abordagem,  label: "Primeira abordagem", offset_days: 0 }
        - { key: followup,   label: "Retomada",           offset_days: 4 }
    - key: qualificacao
      label: "Qualificação"
      goal: "Volume, frequência e fornecedor atual. Achar a brecha."
    - key: cotacao
      label: "Cotação"
      cadence: pos_cotacao
      goal: "Enviar tabela/condição e defender margem."
      phases:
        - { key: envio,    label: "Enviar cotação", offset_days: 0 }
        - { key: retorno,  label: "Cobrar retorno", offset_days: 2 }
    - key: primeiro_pedido
      label: "Primeiro pedido"
      goal: "Fechar o pedido de entrada, mesmo pequeno."
    - key: recorrente
      label: "Cliente recorrente"
      terminal: true
      won: true
    - key: inativo
      label: "Inativo"
      terminal: true

# ---------------------------------------------------------------------
# REFERÊNCIAS DO SETOR (pesquisa jul/2026)
# Vocabulário real do trade — o vendedor de distribuidora fala assim.
# NÃO são fatos da empresa; o motor nunca afirma isto ao cliente.
# ---------------------------------------------------------------------
benchmarks:
  positivacao: >-
    Em quantos clientes da carteira o vendedor de fato registrou pedido no
    período. É o KPI que separa "visitou" de "vendeu".
  ruptura: >-
    Produto em falta na prateleira do cliente. Ruptura em item de Curva A é
    perda dupla: ele não vende e ainda compra do concorrente.
  sell_in_sell_out: >-
    Sell-in é o que você vendeu ao cliente; sell-out é o que ele conseguiu
    revender. Cliente com estoque parado não recompra — acompanhar sell-out
    evita empurrar volume que trava a próxima venda.
  curva_abc: >-
    Poucos itens sustentam a maior parte do faturamento. Curva A: nunca deixar
    faltar. Curva B: ganhar margem. Curva C: girar ou reavaliar.
  preparo_da_visita: >-
    Antes de falar com o cliente, revisar em 3 a 5 minutos: último pedido, o que
    ele mais compra, frequência, títulos em aberto e o que ficou combinado na
    última conversa. Vendedor que chega sem isso vira tirador de pedido.

contact_fields:
  # O tipo muda TUDO: alimentos vive de validade e giro; autopeças de urgência
  # e código de peça; construção de volume e entrega em obra; farma de
  # rastreabilidade e regulação.
  - key: tipo_operacao
    label: "Tipo de distribuição"
    type: enum
    options:
      [alimentos_bebidas, autopecas, material_construcao, farma_saude,
       higiene_limpeza, embalagens, eletrica_hidraulica, agro_insumos,
       papelaria_escritorio, equipamentos, outro]
  - key: curva
    label: "Importância do cliente"
    type: enum
    options: [curva_a, curva_b, curva_c, novo, indefinido]
  - key: segmento_cliente
    label: "Tipo de estabelecimento"
    type: enum
    options: [mercado, padaria, restaurante, bar, hotel, industria, revenda, obra, orgao_publico, outro]
  - key: volume
    label: "Volume estimado"
    type: enum
    options: [baixo, medio, alto, indefinido]
  - key: fornecedor_atual
    label: "Compra hoje de"
    type: enum
    options: [concorrente_a, concorrente_b, atacado_local, direto_industria, nao_sei]
  - key: frequencia
    label: "Frequência de compra"
    type: enum
    options: [semanal, quinzenal, mensal, esporadica, indefinida]

# ---------------------------------------------------------------------
# REGISTRO DE ATENDIMENTO COM VALOR
# Só faz sentido onde a receita vem de serviço executado e repetido.
# Em venda de contrato/pedido (B2B), o dinheiro é acompanhado por
# proposta e pedido — não por 'atendimento'. Por isso é dado, não código.
# ---------------------------------------------------------------------
services:
  enabled: false

lead_sources:
  - prospeccao
  - representante
  - indicacao
  - whatsapp
  - feira
  - cliente_antigo
  - outro

dna_sections:
  - key: linhas
    label: "Linhas e catálogo"
    required: true
    fields:
      - { key: produtos, type: list, required: true, label: "Produtos", help: "Os produtos que você distribui" }
      - { key: marcas, type: list, label: "Marcas", help: "Marcas que você trabalha" }
      - { key: exclusividades, type: list, label: "Exclusividades", help: "Produtos que só você tem na região" }
  - key: comercial
    label: "Condições comerciais"
    required: true
    fields:
      - { key: pedido_minimo, type: money_range, required: true, label: "Pedido mínimo", help: "Valor mínimo para fazer um pedido. Ex.: R$ 500" }
      - { key: prazo_pagamento, type: text, required: true, label: "Prazo de pagamento", help: "Condições de pagamento. Ex.: 30/60 dias para cliente cadastrado" }
      - { key: politica_desconto, type: text, label: "Política de desconto", help: "Quando você dá desconto. Ex.: 5% acima de R$ 3 mil" }
      - { key: tabela_por_volume, type: boolean, label: "Tabela por volume?", help: "Marque se o preço muda conforme a quantidade" }
  - key: logistica
    label: "Entrega"
    required: true
    fields:
      - { key: regiao_atendida, type: text, required: true, label: "Região atendida", help: "Onde você entrega. Ex.: Porto Alegre e região metropolitana" }
      - { key: prazo_entrega, type: text, required: true, label: "Prazo de entrega", help: "Quanto tempo até entregar. Ex.: 15 dias úteis após aprovação" }
      - { key: frete, type: text, label: "Frete", help: "Quem paga o frete e a partir de quanto é grátis" }
      - { key: dias_de_rota, type: text, label: "Dias de rota", help: "Em que dias você entrega em cada região" }
  - key: diferencial
    label: "Diferencial"
    fields:
      - { key: motivo_trocar, type: text, required: true, label: "Por que trocar de fornecedor", help: "Por que o cliente deveria trocar o fornecedor atual pelo seu" }
      - { key: suporte, type: text, label: "Suporte", help: "Como funciona o atendimento depois da venda" }

categories:
  pricing:            "Tabela, pedido mínimo e desconto por volume"
  risk_free_entry:    "Pedido de entrada reduzido para experimentar"
  availability:       "Estoque, prazo de entrega e dias de rota"
  expertise_proof:    "Tempo de mercado, marcas e clientes atendidos"
  catalog:            "Linhas, marcas e exclusividades"
  goal_matching:      "Perfil do estabelecimento → mix ideal"
  objections:         "Caro, já tenho fornecedor, pedido mínimo alto"
  commitment_offer:   "Contrato de fornecimento e condição por volume"
  reciprocity:        "Amostra, brinde e apoio de ponto de venda"
  limits_and_ethics:  "O que não prometer sobre preço, prazo e frete"
  retention:          "Recompra, reposição e cliente inativo"
  ecosystem:          "Representantes, transportadoras e indústria parceira"

# O campo `frequencia` do contato vira ciclo previsto de reposição: o núcleo
# avisa antes do estoque do cliente acabar, em vez de esperar ele ligar.
recurrence:
  frequency_field: frequencia
  remind_before_days: 3
  intervals_days:
    semanal: 7
    quinzenal: 15
    mensal: 30
  default_days: 30

# ---------------------------------------------------------------------
# ORQUESTRADOR DE ESTRATÉGIA — qual escola de venda governa cada situação
# NESTE segmento. Não existe "a melhor técnica": existe a técnica certa para
# o tamanho da decisão. Rackham provou que fechamento por pressão levanta a
# conversão em ticket baixo e a DERRUBA em ticket alto — por isso barbearia
# e indústria não podem responder com a mesma escola.
# A entrada da biblioteca pode sobrescrever (`school`); sem override, vale isto.
# Escolas válidas: docs/blueprint/COS_Escolas_de_Venda.md
# ---------------------------------------------------------------------
strategy_map:
  pricing:             consultiva_spin
  risk_free_entry:     oferta_valor
  availability:        fechamento_classico
  expertise_proof:     persuasao_cialdini
  catalog:             consultiva_spin
  goal_matching:       consultiva_spin
  objections:          negociacao_voss
  commitment_offer:    oferta_valor
  reciprocity:         cadencia_blount
  limits_and_ethics:   relacionamento_carnegie
  retention:           cadencia_blount
  ecosystem:           relacionamento_carnegie

cadences:
  - key: pos_cotacao
    applies_to: proposal_followup
    steps:
      - { offset_days: 2, intent: "Confirmar recebimento e tirar dúvida" }
      - { offset_days: 6, intent: "Oferecer condição de entrada" }
    stop_on: [replied, converted, opted_out, lost]

  - key: recompra
    applies_to: repurchase
    steps:
      - { offset_days: 25, intent: "Antecipar a reposição antes de acabar o estoque" }
    stop_on: [converted, opted_out]

  - key: reativacao
    applies_to: reactivation
    steps:
      - { offset_days: 45, intent: "Descobrir por que parou de comprar" }
    stop_on: [replied, converted, opted_out]
    max_attempts: 3

hard_rules:
  - "Nunca prometer preço, prazo ou frete fora do que está no DNA."
  - "Não desqualificar o fornecedor atual do cliente — mostrar a vantagem, não atacar."

kpis:
  - taxa_conversao
  - ticket_medio
  - recompra
  - clientes_ativos
  - tempo_resposta_mediana
