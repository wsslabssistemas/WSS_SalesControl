key: escola_esportiva
name: Escola Esportiva e Clube
version: 1.0.0

# =====================================================================
# Natação, artes marciais, tênis, escolinhas e clubes.
# Diferença central para academia: quem decide muitas vezes NÃO é quem
# pratica (mãe/pai matricula o filho), e a aula experimental é agendada
# em turma com horário fixo — não é "semana livre".
# =====================================================================

capabilities: []   # B2C local: prospecção fria de pessoas é proibida (LGPD)

vocabulary:
  lead: "interessado"
  conversion: "matrícula"
  churn: "evasão"
  catalog_item: "turma"

discovery_axis: "quem vai praticar (criança, adolescente, adulto) e o objetivo (saúde, competição, disciplina, lazer)"

journey:
  allow_skip: true
  allow_regression: true
  stages:
    - key: contato
      label: "Primeiro contato"
      goal: "Descobrir para quem é a aula e o objetivo. Nunca abrir com preço."
    - key: descoberta
      label: "Descoberta"
      goal: "Idade, nível, disponibilidade de horário e quem decide."
    - key: aula_experimental
      label: "Aula experimental"
      cadence: pos_experimental
      goal: "Agendar, confirmar presença e conduzir a experiência."
      phases:
        - { key: agendada,   label: "Agendada",           offset_days: 0 }
        - { key: lembrete,   label: "Lembrete véspera",   offset_days: 1 }
        - { key: pos_aula,   label: "Retorno pós-aula",   offset_days: 3 }
    - key: proposta
      label: "Proposta"
      goal: "Apresentar a turma e o plano adequados ao horário dele."
    - key: negociacao
      label: "Negociação"
      goal: "Tratar a objeção real (horário, valor, distância) e fechar."
    - key: matriculado
      label: "Matriculado"
      terminal: true
      won: true
    # PERDIDO DEIXOU DE SER TERMINAL (ago/2026, decisão do fundador).
    #
    # O piloto real mediu: 459 desfechos de "perdeu por SILÊNCIO" contra 59 de
    # "perdeu por DECISÃO". Quase 8 para 1. Etapa terminal desliga o motor —
    # sem follow-up e sem reativação —, então marcar como perdido quem apenas
    # parou de responder apagava a pessoa para sempre. Sumir não é dizer não.
    #
    # As duas etapas agora espelham a enum canônica de desfecho do `0044`:
    # `perdido` = perdeu_silencio, `recusou` = perdeu_decisao.
    - key: perdido
      label: "Parou de responder"
      lost: true
      goal: "Sumiu sem dizer não. Não recebe recompra — recebe REATIVAÇÃO, com ângulo novo, depois de 60 a 90 dias."
    - key: recusou
      label: "Disse não"
      terminal: true
      lost: true
      goal: "Recusou de forma explícita. Aqui a conversa encerra de verdade."

contact_fields:
  - key: praticante
    label: "Quem vai praticar"
    type: enum
    options: [crianca, adolescente, adulto, melhor_idade]
  - key: modalidade
    label: "Modalidade de interesse"
    type: enum
    options: [natacao, hidroginastica, judo, jiu_jitsu, karate, muay_thai, boxe, futsal, tenis, danca, outra]
  - key: objetivo
    label: "Objetivo"
    type: enum
    options: [saude, disciplina, competicao, lazer, socializacao, reabilitacao]
  - key: nivel
    label: "Nível"
    type: enum
    options: [iniciante, intermediario, avancado]
  - key: turno_preferido
    label: "Turno preferido"
    type: enum
    options: [manha, tarde, noite, sabado]

# ---------------------------------------------------------------------
# AGENDAMENTO
# A aula experimental tem hora marcada dentro da grade de turmas.
# ---------------------------------------------------------------------
scheduling:
  enabled: true
  default_duration_min: 60
  slot_step_min: 60
  min_advance_min: 120

# ---------------------------------------------------------------------
# REGISTRO DE ATENDIMENTO COM VALOR
# Só faz sentido onde a receita vem de serviço executado e repetido.
# Em venda de contrato/pedido (B2B), o dinheiro é acompanhado por
# proposta e pedido — não por 'atendimento'. Por isso é dado, não código.
# ---------------------------------------------------------------------
services:
  enabled: true
  label: "Atendimentos"
  item_label: "Serviço"

# ---------------------------------------------------------------------
# VIGÊNCIA DE CONTRATO
# Liga início/vencimento no cadastro e as TRÊS janelas de renovação
# (`lib/renovacao.ts`): 60 dias falando do RESULTADO — sem mencionar
# renovação —, 30 abrindo a continuidade e 7 com a condição concreta.
# Contato único no vencimento chega quando a pessoa já decidiu, e vira
# negociação de preço sob pressão de prazo.
# ---------------------------------------------------------------------
contract:
  enabled: true
  label: "Plano"

lead_sources:
  - whatsapp
  - instagram
  - indicacao
  - presencial
  - escola_parceira
  - campanha
  - outro

dna_sections:
  - key: modalidades
    label: "Modalidades e turmas"
    required: true
    fields:
      - { key: lista, type: list, required: true, label: "Lista", help: "Quais convênios você aceita. Escreva o nome exato" }
      - { key: faixas_etarias, type: text, required: true, label: "Faixas etárias", help: "Idades que você atende. Ex.: a partir de 4 anos", options: ["A partir de 3 anos", "A partir de 6 anos", "Crianças e adolescentes", "Todas as idades, em turmas separadas"] }
      - { key: grade_horarios, type: schedule, required: true, label: "Grade de horários", help: "Os horários de cada turma" }
      - { key: vagas_por_turma, type: text, label: "Vagas por turma", help: "Quantos alunos cabem por turma", options: ["Até 6 alunos", "Até 10 alunos", "Até 15 alunos", "Até 20 alunos", "Varia por turma e horário"] }
  - key: pricing
    label: "Planos e valores"
    required: true
    fields:
      - { key: range, type: money_range, required: true, label: "Faixa de valores", help: "A faixa de preço dos seus serviços. Ex.: de R$ 40 a R$ 90" }
      - { key: matricula, type: text, label: "Taxa de matrícula", help: "Tem taxa de matrícula? Quanto?", options: ["Não cobro taxa de matrícula", "Cobro taxa de matrícula, uma vez por ano", "Cobro taxa de matrícula só para aluno novo", "Isento a taxa em campanha de início de turma"] }
      - { key: desconto_irmaos, type: boolean, label: "Desconto para irmãos", help: "Marque se você dá desconto para irmãos" }
      - { key: formas_pagamento, type: list, label: "Formas de pagamento", help: "Como o cliente pode pagar. Ex.: Pix, débito, crédito em 2x" }
  - key: experimental
    label: "Aula experimental"
    required: true
    fields:
      - { key: oferece, type: boolean, required: true, label: "Oferece?", help: "Marque se você oferece esta condição" }
      - { key: como_funciona, type: text, required: true, label: "Como funciona", help: "Explique como funciona a aula experimental", options: ["Aula experimental gratuita, na turma da idade dele", "Aula experimental gratuita, com agendamento", "Primeira aula com desconto, não gratuita", "Semana experimental completa"] }
      - { key: precisa_agendar, type: boolean, label: "Precisa agendar?", help: "Marque se a aula experimental precisa ser agendada" }
      - { key: o_que_levar, type: text, label: "O que levar", help: "O que o aluno deve levar. Ex.: toalha, garrafa e touca", options: ["Roupa confortável e garrafa de água", "Toalha, garrafa de água e chinelo", "Toalha, garrafa, touca e óculos", "Só a roupa — o resto é nosso"] }
  - key: estrutura
    label: "Estrutura"
    fields:
      - { key: instalacoes, type: list, label: "Instalações", help: "O que você tem no espaço. Ex.: vestiário, estacionamento" }
      - { key: professores, type: text, label: "Professores", help: "Quem dá aula e a formação de cada um", options: ["Equipe formada na área, com registro no conselho", "Equipe própria, com formação e experiência no ramo", "Professores contratados por especialidade", "Sou eu quem dá as aulas"] }
      - { key: estacionamento, type: boolean, label: "Estacionamento", help: "Tem estacionamento? Onde o cliente deixa o carro?" }
  - key: regras
    label: "Regras e exigências"
    fields:
      - { key: atestado_medico, type: boolean, label: "Exige atestado médico?", help: "Marque se você exige atestado médico" }
      - { key: uniforme, type: text, label: "Uniforme", help: "Precisa de uniforme? Qual e onde comprar", options: ["Não é obrigatório", "Obrigatório, vendido aqui", "Obrigatório a partir de um nível", "Recomendado, mas não obrigatório"] }
      - { key: idade_minima, type: text, label: "Idade mínima", help: "Idade mínima para participar", options: ["A partir de 3 anos", "A partir de 6 anos", "A partir de 12 anos", "A partir de 16 anos", "Sem idade mínima"] }

  - key: free_notes
    label: "Outras informações importantes"
    type: rich_text
    # Entra no contexto marcado como não estruturado.
    # Nunca pode ser fonte de preço, horário ou política.

categories:
  pricing:            "Planos, matrícula e desconto para irmãos"
  risk_free_entry:    "Aula experimental"
  availability:       "Grade de horários e vagas por turma"
  expertise_proof:    "Professores, formação e resultados dos alunos"
  catalog:            "Modalidades oferecidas"
  goal_matching:      "Idade e objetivo → turma ideal"
  objections:         "Caro, longe, horário não bate, vergonha"
  commitment_offer:   "Plano semestral ou anual"
  reciprocity:        "Kit, uniforme ou matrícula cortesia"
  limits_and_ethics:  "Saúde, lesões, atestado e o que não prometer"
  retention:          "Aluno faltando, desmotivado, renovação"
  ecosystem:          "Escolas parceiras, convênios e eventos"

# ---------------------------------------------------------------------
# ORQUESTRADOR DE ESTRATÉGIA — qual escola de venda governa cada situação
# NESTE segmento. Não existe "a melhor técnica": existe a técnica certa para
# o tamanho da decisão. Rackham provou que fechamento por pressão levanta a
# conversão em ticket baixo e a DERRUBA em ticket alto — por isso barbearia
# e indústria não podem responder com a mesma escola.
# A entrada da biblioteca pode sobrescrever (`school`); sem override, vale isto.
# Escolas válidas: docs/blueprint/COS_Escolas_de_Venda.md
# ---------------------------------------------------------------------
strategy_map:
  pricing:             oferta_valor
  risk_free_entry:     persuasao_cialdini
  availability:        fechamento_classico
  expertise_proof:     persuasao_cialdini
  catalog:             consultiva_spin
  goal_matching:       relacionamento_carnegie
  objections:          negociacao_voss
  commitment_offer:    fechamento_classico
  reciprocity:         relacionamento_carnegie
  limits_and_ethics:   relacionamento_carnegie
  retention:           cadencia_blount
  ecosystem:           relacionamento_carnegie

cadences:
  - key: pos_experimental
    applies_to: trial_followup
    steps:
      - { offset_days: 1, intent: "Perguntar como foi a experiência" }
      - { offset_days: 3, intent: "Convidar para fechar a turma" }
      - { offset_days: 7, intent: "Última chamada com a vaga do horário" }
    stop_on: [converted, opted_out, lost]

  - key: nao_compareceu
    applies_to: reactivation
    steps:
      - { offset_days: 1, intent: "Reagendar sem cobrança" }
    stop_on: [replied, converted, opted_out]
    max_attempts: 2

hard_rules:
  - "Nunca afirmar horário, vaga ou valor que não esteja no DNA."
  - "Quando o praticante é menor, falar com o responsável — ele é quem decide."
  - "Não prometer vaga em turma cheia."

kpis:
  - taxa_conversao
  - experimentais_agendadas
  - comparecimento_experimental
  - tempo_resposta_mediana
  - evasao
