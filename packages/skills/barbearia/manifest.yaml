key: barbearia
name: Barbearia
version: 1.0.0

# Modulos do segmento. B2C local nao faz prospeccao fria de pessoas (LGPD).
capabilities: []

# =====================================================================
# A PROVA DA TESE DO COS
#
# Compare este arquivo com o da academia. Mesma estrutura, mesmas 12
# categorias, mesmo motor. Muda só o conteúdo.
#
# Se lançar uma barbearia exigir UMA linha de código nova, a promessa
# de "um cérebro, várias especializações" está quebrada.
# =====================================================================

vocabulary:
  lead: "cliente em potencial"
  conversion: "primeiro agendamento"
  churn: "cliente que parou de voltar"
  catalog_item: "serviço"

discovery_axis: "ocasião e frequência (rotina, evento, manutenção)"

journey:
  allow_skip: true
  allow_regression: true
  stages:
    - key: contato
      label: "Primeiro contato"
      goal: "Descobrir o que a pessoa procura e para quando."
    - key: descoberta
      label: "Descoberta"
      goal: "Entender serviço desejado, urgência e preferência de profissional."
    - key: proposta
      label: "Proposta"
      goal: "Indicar serviço e horário disponível."
    - key: agendado
      label: "Agendado"
      cadence: appointment_confirm
      goal: "Confirmar presença e reduzir falta."
      phases:
        - { key: confirmado,  label: "Confirmado",   offset_days: 0 }
        - { key: lembrete,    label: "Lembrete",     offset_days: 1 }
        - { key: pos_servico, label: "Pós-serviço",  offset_days: 1 }
    - key: recorrente
      label: "Cliente recorrente"
      terminal: true
    - key: perdido
      label: "Perdido"
      terminal: true

# ---------------------------------------------------------------------
# CAMPOS PRÓPRIOS DO SEGMENTO
# O negócio é RECORRÊNCIA: o cliente fiel volta a cada ~21 dias e rende
# 17 a 24 visitas por ano. Por isso os campos abaixo existem — eles são o
# que permite calcular QUANDO chamar de volta, e não esperar o cliente
# lembrar sozinho. Barbearia com retorno programado retém muito mais.
# ---------------------------------------------------------------------
contact_fields:
  - key: servico_preferido
    label: "Serviço preferido"
    type: enum
    options: [corte, barba, corte_e_barba, coloracao, tratamento, infantil]
  # Define o intervalo do retorno. Degradê curto pede 2 semanas; corte médio
  # com barba, 3 a 4 semanas.
  - key: frequencia
    label: "Frequência"
    type: enum
    options: [semanal, quinzenal, tres_semanas, mensal, bimestral, esporadico]
  - key: dia_preferido
    label: "Dia que costuma vir"
    type: enum
    options: [segunda, terca, quarta, quinta, sexta, sabado, sem_preferencia]
  - key: turno_preferido
    label: "Turno preferido"
    type: enum
    options: [manha, tarde, noite, sem_preferencia]
  - key: profissional_preferido
    label: "Barbeiro preferido"
    type: enum
    options: [sem_preferencia, definido]
  # Por que ele viria mais vezes — a alavanca de frequência de cada cliente.
  - key: gatilho_retorno
    label: "O que o traria mais vezes"
    type: enum
    options:
      [horario_facil, preco_pacote, barba_junto, atendimento_rapido,
       ambiente, produto_domicilio, indefinido]

# ---------------------------------------------------------------------
# RECORRÊNCIA
# O núcleo sabe calcular "quando chamar de volta"; QUAIS campos usar e
# quantos dias cada frequência vale é dado do segmento (Lei 1).
# Referência de mercado: fiel volta a cada ~21 dias; o lembrete funciona
# quando sai alguns dias ANTES do ciclo fechar.
# ---------------------------------------------------------------------
recurrence:
  frequency_field: frequencia
  preferred_day_field: dia_preferido
  remind_before_days: 3
  intervals_days:
    semanal: 7
    quinzenal: 15
    tres_semanas: 21
    mensal: 30
    bimestral: 60
  default_days: 21

# ---------------------------------------------------------------------
# REFERÊNCIAS DO SEGMENTO (pesquisa de mercado, jul/2026)
# Servem de parâmetro para o gestor comparar a própria operação. NÃO são
# fatos da empresa — o motor nunca afirma isto ao cliente, só o DNA vale.
# ---------------------------------------------------------------------
benchmarks:
  visitas_ano_cliente_fiel: "17 a 24"
  intervalo_medio_dias: 21
  ticket_medio_faixa: "R$ 50 a R$ 80"
  atendimentos_dia_por_cadeira: "10 a 15"
  duracao_servico_min: "30 a 45"
  faturamento_mes_por_cadeira: "R$ 13.000 a R$ 20.000"
  comissao_profissional: "40% a 50%"
  raio_captacao_km: "3 a 5"
  observacao_gargalo: >-
    O maior gargalo é a ociosidade: cada furo de 45 min na agenda é receita que
    não volta. Lembrete automático (e sinal antecipado) reduz drasticamente a
    falta.

lead_sources:
  - whatsapp
  - instagram
  - presencial
  - indicacao
  - google
  - campanha
  - outro

dna_sections:
  - key: pricing
    label: "Tabela de serviços"
    required: true
    fields:
      - { key: range, type: money_range, required: true, label: "Faixa de valores", help: "A faixa de preço dos seus serviços. Ex.: de R$ 40 a R$ 90" }
      - { key: plans, type: table, columns: [servico, valor, duracao], label: "Planos e preços", help: "Cada serviço com seu valor. Ex.: Corte — R$ 45 — 40 min" }
      - { key: payment_methods, type: list, label: "Formas de pagamento", help: "Como o cliente pode pagar. Ex.: Pix, débito, crédito em 2x" }
  - key: availability
    label: "Horário e agenda"
    required: true
    fields:
      - { key: weekly_hours,  type: schedule, required: true, label: "Horário de funcionamento", help: "Os dias e horários que você atende. Ex.: Seg a Sex 9h-19h; Sáb 8h-14h" }
      - { key: booking_rule,  type: text, label: "Como agendar", help: "Precisa marcar antes ou atende por ordem de chegada? Ex.: Só com hora marcada" }
  - key: catalog
    label: "Serviços oferecidos"
    required: true
    fields:
      - { key: items, type: table, columns: [nome, duracao, profissional, observacao], label: "Itens", help: "Liste o que você oferece. O sistema só pode falar do que estiver aqui" }
  - key: risk_free_entry
    label: "Oferta de entrada"
    fields:
      - { key: exists, type: boolean, required: true, label: "Oferece?", help: "Marque se você oferece alguma condição especial para quem vem pela primeira vez" }
      - { key: offer,  type: text, label: "Qual é a oferta", help: "Descreva a condição de primeira visita. Ex.: Primeiro corte com 20% de desconto" }
  - key: location_contact
    label: "Endereço e contatos"
    required: true
    fields:
      - { key: address,   type: text, required: true, label: "Endereço", help: "Endereço completo com ponto de referência. Ex.: Rua X, 100 - ao lado do mercado" }
      - { key: whatsapp,  type: text, label: "WhatsApp", help: "O número que o cliente usa para falar com você" }
      - { key: instagram, type: text, label: "Instagram", help: "Seu perfil. Ex.: @suaempresa" }
  - key: differentials
    label: "Diferenciais"
    fields:
      - { key: items, type: list, label: "Itens", help: "Liste o que você oferece. O sistema só pode falar do que estiver aqui" }
  - key: policies
    label: "Políticas"
    fields:
      - { key: no_show,      type: text, label: "Política de falta", help: "O que acontece quando o cliente falta sem avisar. Ex.: Cobramos 50% na próxima" }
      - { key: cancellation, type: text, label: "Política de cancelamento", help: "Até quando dá para desmarcar sem custo. Ex.: Até 2h antes, sem cobrança" }
  - key: free_notes
    label: "Outras informações importantes"
    type: rich_text

# As mesmas 12 categorias canônicas, outro conteúdo
categories:
  pricing:          "Tabela de serviços"
  risk_free_entry:  "Primeira visita promocional"
  availability:     "Agenda e horários"
  expertise_proof:  "Barbeiro especialista e portfólio"
  catalog:          "Corte, barba, coloração, tratamentos"
  goal_matching:    "Tipo de cabelo e ocasião → serviço ideal"
  objections:       "Caro, sem tempo, receio de mudar de barbeiro"
  commitment_offer: "Pacote de sessões / plano de assinatura"
  reciprocity:      "Brinde, bebida cortesia, desconto na indicação"
  limits_and_ethics: "Não prometer resultado de coloração ou tratamento"
  retention:        "Cliente que não volta há X semanas"
  ecosystem:        "Produtos revendidos e parceiros"

cadences:
  # Falta é o maior problema do segmento — cadência própria
  - key: appointment_confirm
    applies_to: trial_followup
    steps:
      - { offset_days: -1, intent: "Confirmação com fechamento por alternativa" }
      - { offset_days: 1,  intent: "Pós-serviço: satisfação e reagendamento" }
    stop_on: [converted, opted_out]

  - key: rescue_lapsed
    applies_to: reactivation
    steps:
      - { offset_days: 0, intent: "Lembrete de manutenção baseado na frequência habitual" }
      - { offset_days: 7, intent: "Oferta de retorno com horário específico" }
    stop_on: [replied, converted, opted_out]
    max_attempts: 2

hard_rules:
  - "Nunca afirmar horário, valor ou serviço que não esteja no DNA."
  - "Nunca confirmar disponibilidade de agenda sem consultar o fato no DNA."
  - "Nunca prometer resultado exato de coloração ou tratamento capilar."
  - "Nunca encerrar com pergunta aberta — oferecer dois horários concretos."
  - "Uma mensagem, um objetivo."

kpis:
  - conversion_rate
  - no_show_rate
  - return_rate_30d
  - median_response_time
