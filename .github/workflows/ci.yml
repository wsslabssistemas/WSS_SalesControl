name: CI

# Falha o build quando um manifesto de Skill nasce inválido — a Lei 2
# ("Skill é dado, nunca código") virando barreira automática, não revisão.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  skill-validator:
    name: Validador de Skill (RF-02)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm install
      - name: Validar manifestos
        run: npm run -w @cos/skill-loader validate
      - name: Testes do validador
        run: npm run -w @cos/skill-loader test
      # O validador acima olha o MANIFESTO. Este olha a BIBLIOTECA — foi por
      # essa fresta que a barbearia ganhou 2 entradas numa categoria que não
      # existe e sobreviveu do 0017 até ago/2026.
      - name: Validar bibliotecas (categoria, escola e fatos)
        run: node packages/db/tests/library_check.mjs
      # DNA de demonstração com chave errada falha na direção que PARECE segura:
      # a entrada escala para sempre e ninguém entende por quê.
      - name: Validar DNA de demonstração
        run: node packages/db/tests/demo_dna_check.mjs
      # Espaçamento quebrado se parece com "ainda não chegou a hora": a tela
      # continua funcionando e a prática distribuída simplesmente não acontece.
      # Roda no CI porque é lógica pura — sem banco e sem chave.
      - name: Regra da repescagem espaçada
        run: node packages/db/tests/repescagem_test.mjs
